# One command for a reviewer: cp .env.example .env && docker compose up
# Starts MongoDB, loads the dataset once, starts the API, then the web app on
# http://localhost:8080 (API docs stay available on http://localhost:3000/api/docs).
services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Runs once and exits. Safe to re-run: the seed upserts, it never duplicates.
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: finance-dashboard-api
    command: ['node', 'dist/seed/seed.js']
    environment:
      MONGODB_URI: mongodb://mongo:27017/finance
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env (copy .env.example)}
    depends_on:
      mongo:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: finance-dashboard-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGODB_URI: mongodb://mongo:27017/finance
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env (copy .env.example)}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      LOGIN_ATTEMPTS_PER_MINUTE: ${LOGIN_ATTEMPTS_PER_MINUTE:-5}
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      # node:22-slim has no curl, so Node's built-in fetch does the check.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: finance-dashboard-web
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
