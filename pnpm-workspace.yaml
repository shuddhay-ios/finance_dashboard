packages:
  - apps/*
  - packages/*

# pnpm 10 skips dependency install scripts unless a package is listed here.
# swc and esbuild need theirs to fetch native binaries; mongodb-memory-server
# downloads the MongoDB binary used by tests. argon2 is deliberately absent: it
# ships prebuilt binaries, and its install script would try (and fail) to compile C++.
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - mongodb-memory-server
