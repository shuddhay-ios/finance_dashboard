packages:
  - apps/*
  - packages/*

# pnpm 10 skips dependency install scripts unless a package is listed here.
# These four need theirs: native binaries (argon2, swc, esbuild) and the MongoDB
# binary that mongodb-memory-server downloads for tests.
onlyBuiltDependencies:
  - '@swc/core'
  - argon2
  - esbuild
  - mongodb-memory-server
