server {
  listen 8080;
  root /usr/share/nginx/html;

  # The browser talks to one origin: /api is forwarded to the API container and everything
  # else is the web app. Production does the same with a Vercel rewrite, which is what lets
  # the SameSite=Strict refresh cookie work.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Profile photos: the API enforces its own 2 MB limit; this only has to let them through.
    client_max_body_size 3m;
    # Pass CSV downloads on as they are streamed instead of buffering the whole file.
    proxy_buffering off;
  }

  # Hashed asset files never change, so browsers may cache them for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Routes like /dashboard exist only inside the app, so every unknown path gets index.html.
  location / {
    try_files $uri /index.html;
  }
}
